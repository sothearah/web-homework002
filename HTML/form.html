<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunrise Care Hospital Form</title>
    <link rel="stylesheet" href="../CSS/style.css" />
  </head>
  <body class="body-container">
    <form class="form-container">
      <!-- <fieldset> -->
      <!-- <legend>Share your experienced with us</legend> -->
      <label for="username">Full Name : </label>
      <input class="input-lable" type="text" placeholder="Preap Sovath" />
      <br />
      <label>Gender : </label>
      <input class="input-lable" type="radio" name="gender" />
      <label for="male">Male</label>
      <input class="input-lable" type="radio" name="gender" />
      <label for="female">Female</label>
      <br />
      <label>Phone Number : +855 </label>
      <input
        class="input-lable"
        type="tel"
        dir="rtl"
        placeholder="12 345 789"
        required
        pattern="[0-9]{2} [0-9]{3} [0-9]{3}"
      />
      <br />
      <label>Email : </label>
      <input
        class="input-lable"
        type="email"
        dir="rtl"
        placeholder="someone@gmail.com"
        required
        pattern="[a-z0-9._%+-]+@gmail\.com"
      />
      <p>Where do you find us?</p>
      <input class="input-lable" type="checkbox" />
      <label>Facebook</label>
      <input class="input-lable" type="checkbox" />
      <label>Friend or Relative</label>
      <input class="input-lable" type="checkbox" />
      <label>Other</label>
      <p>How you so satisfied about <b>Sunrise Hospital</b>?</p>
      <input type="radio" name="satisfied" />
      <label>Bad experienced</label>
      <meter
        min="0"
        max="600"
        low="30"
        high="80"
        optimum="10"
        value="90"
      ></meter>
      <br />
      <input type="radio" name="satisfied" />
      <label>Average</label>
      <meter
        min="0"
        max="100"
        low="30"
        high="80"
        optimum="50"
        value="90"
      ></meter>
      <br />
      <input class="input-lable" type="radio" name="satisfied" />
      <label>Very satisfied</label>
      <meter min="0" max="100" value="100"></meter>
      <p>Give us some feedback</p>
      <textarea
        dir="rtl"
        rows="8"
        cols="55"
        placeholder="I love Sunrise Hospital"
      ></textarea>
      <br />
      <input class="input-lable one" type="reset" value="Reset Form" />
      <input
        class="input-lable two"
        type="submit"
        name="submit"
        value="Submit"
      />
      <a
        style="display: inline; margin-right: 20px"
        class="home-button"
        href="../HTML/index.html"
        >Back to home</a
      >
      <!-- </fieldset> -->
    </form>
  </body>
</html>
